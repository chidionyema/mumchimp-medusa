# The Estate-as-Platform operating model, on every pull request here too (crew#292 CP3).
#
# There is nothing to configure and nothing to copy. The steps, the rego and the budget
# live once in chidionyema/idp; this file names them. Same shape as security-scan.yml
# beside it: `@main` on a same-owner call, so an idp change does not need re-pinning in
# every repository. `pull_request` only -- bin/pr-report needs a pull request number and
# a push to main has none.
#
# What it refuses here: an instruction line that sends a person to a console
# (rule=no_gui_actions), and an identity resource added with no grant in the same PR
# (rule=provisioning_complete). The founder-facing, cost and canary rules key off idp
# paths (backstage/, platform/oci/) that do not exist in this repo, so they stay quiet.
name: operating-model-gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  operating-model-gate:
    uses: chidionyema/idp/.github/workflows/operating-model-gate.yml@main
    permissions: { contents: read, pull-requests: write }
